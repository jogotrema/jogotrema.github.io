<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREMA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #050510;
      --neon-primary: #00ffff;
      --neon-secondary: #0088ff;
      --neutral: #555577;
      --text: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background-color: var(--bg-main);
      color: var(--text);
      font-family: 'Chakra Petch', sans-serif;
    }

    /* Fundo da sala de arcade */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(
          180deg,
          rgba(2, 4, 20, 0.48) 0%,
          rgba(3, 5, 25, 0.62) 48%,
          rgba(2, 3, 15, 0.82) 100%
        ),
        url('arcade-bg.png') center center / cover no-repeat;
      filter: saturate(0.9) contrast(1.05);
      transform: scale(1.02);
    }

    /* Escurecimento central + scanlines CRT */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(3, 8, 35, 0.12) 0%,
          rgba(3, 5, 20, 0.58) 72%,
          rgba(2, 3, 12, 0.78) 100%
        ),
        linear-gradient(
          0deg,
          transparent 50%,
          rgba(0, 255, 255, 0.025) 50%
        );
      background-size: auto, 100% 4px;
    }

    .arcade-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 35%, rgba(0, 136, 255, 0.10), transparent 30%),
        radial-gradient(circle at 15% 70%, rgba(255, 0, 153, 0.08), transparent 28%),
        radial-gradient(circle at 85% 70%, rgba(0, 255, 255, 0.07), transparent 28%),
        linear-gradient(180deg, #04030c 0%, #070515 52%, #03030a 100%);
    }

    .arcade-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0, 255, 255, 0.018) 50%, transparent 50%);
      background-size: 100% 4px;
      mix-blend-mode: screen;
    }

    .arcade-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.62) 100%),
        linear-gradient(90deg, rgba(255, 0, 153, 0.035), transparent 25%, transparent 75%, rgba(0, 136, 255, 0.035));
    }

    .ceiling-line {
      position: absolute;
      height: 3px;
      border-radius: 999px;
      filter: blur(0.5px);
      opacity: 0.85;
    }

    .ceiling-line-a {
      width: 180px;
      top: 8%;
      left: 7%;
      transform: rotate(8deg);
      background: #0088ff;
      box-shadow: 0 0 12px #0088ff, 0 0 30px rgba(0, 136, 255, 0.45);
    }

    .ceiling-line-b {
      width: 150px;
      top: 11%;
      right: 8%;
      transform: rotate(-10deg);
      background: #ff1493;
      box-shadow: 0 0 12px #ff1493, 0 0 30px rgba(255, 20, 147, 0.35);
    }

    .cabinet {
      position: absolute;
      width: 84px;
      height: 150px;
      bottom: 16%;
      border: 1px solid rgba(0, 136, 255, 0.16);
      background:
        linear-gradient(135deg, transparent 0 8%, rgba(0, 136, 255, 0.06) 8% 12%, transparent 12%),
        linear-gradient(180deg, rgba(0, 136, 255, 0.08), rgba(0, 0, 0, 0.38));
      box-shadow:
        inset 0 0 20px rgba(0, 0, 0, 0.55),
        0 0 18px rgba(0, 136, 255, 0.05);
      transform: perspective(500px) rotateY(8deg);
      opacity: 0.55;
    }

    .cabinet::before {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      top: 15px;
      height: 58px;
      border: 1px solid rgba(0, 255, 255, 0.2);
      background:
        radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.08), transparent 65%),
        #050612;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.05);
    }

    .cabinet::after {
      content: '';
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 16px;
      height: 5px;
      background: rgba(255, 20, 147, 0.22);
      box-shadow: 0 0 8px rgba(255, 20, 147, 0.28);
    }

    .cabinet-left {
      left: 2%;
    }

    .cabinet-right {
      right: 2%;
      transform: perspective(500px) rotateY(-8deg);
    }

    .cabinet-one {
      opacity: 0.65;
    }

    .cabinet-two {
      width: 66px;
      height: 120px;
      bottom: 10%;
      opacity: 0.38;
    }

    .cabinet-left.cabinet-two {
      left: 11%;
      transform: perspective(500px) rotateY(10deg);
    }

    .cabinet-right.cabinet-two {
      right: 11%;
      transform: perspective(500px) rotateY(-10deg);
    }

    .floor-grid {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -4%;
      height: 32%;
      transform: perspective(320px) rotateX(62deg);
      transform-origin: bottom;
      background:
        linear-gradient(rgba(0, 136, 255, 0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 136, 255, 0.10) 1px, transparent 1px);
      background-size: 42px 28px;
      opacity: 0.22;
      box-shadow: 0 -20px 60px rgba(0, 136, 255, 0.04);
    }

    .home {
      position: relative;
      z-index: 2;
      width: min(100%, 650px);
      padding: 32px 20px 38px;
      text-align: center;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
      position: relative;
      z-index: 1;
      animation: fadeIn 500ms ease forwards;
    }

    .home::before {
      content: '';
      position: absolute;
      width: 420px;
      height: 420px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(0, 136, 255, 0.10) 0%,
        rgba(0, 255, 255, 0.035) 35%,
        transparent 70%
      );
      filter: blur(10px);
      pointer-events: none;
      z-index: -1;
    }

    .brand {
      margin: 0 0 12px;
      position: relative;
      color: var(--neon-primary);
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.8rem, 7vw, 3.2rem);
      line-height: 1;
      letter-spacing: 4px;
      text-shadow:
        0 0 10px var(--neon-primary),
        0 0 25px var(--neon-secondary);
    }

    .brand-mark {
      width: 120px;
      height: 1px;
      margin: 22px auto 18px;
      position: relative;
      background: rgba(0, 255, 255, 0.35);
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      background: var(--neon-primary);
      box-shadow: 0 0 8px var(--neon-primary);
      transform: translateY(-50%);
    }

    .brand-mark::before {
      left: 0;
    }

    .brand-mark::after {
      right: 0;
    }

    .subtitle {
      margin: 0 0 52px;
      position: relative;
      color: #7d86a8;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 136, 255, 0.22);
    }

    .menu {
      width: min(100%, 310px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 14px 20px;
      border: 1px solid rgba(0, 136, 255, 0.35);
      border-radius: 8px;
      background: rgba(2, 7, 28, 0.72);
      color: #68718f;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-decoration: none;
      cursor: pointer;
      transition:
        color 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
    }

    .mode-button::before {
      content: '>';
      position: absolute;
      left: 18px;
      opacity: 0;
      color: var(--neon-primary);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .mode-button:hover,
    .mode-button:focus-visible {
      color: var(--neon-primary);
      border-color: var(--neon-primary);
      background: rgba(0, 255, 255, 0.07);
      box-shadow:
        0 0 12px rgba(0, 255, 255, 0.18),
        inset 0 0 12px rgba(0, 136, 255, 0.08);
      transform: translateY(-2px);
      outline: none;
    }

    .mode-button:hover::before,
    .mode-button:focus-visible::before {
      opacity: 1;
      transform: translateX(2px);
    }

    .hint {
      margin: 42px 0 0;
      color: var(--neutral);
      font-size: 0.65rem;
      letter-spacing: 1px;
    }

    .hint kbd {
      font-family: 'Press Start 2P', monospace;
      color: var(--neon-secondary);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 480px) {
      body::before {
        background-position: 58% center;
      }

      .home {
        padding: 24px 20px;
      }

      .subtitle {
        margin-bottom: 40px;
      }

      .mode-button {
        min-height: 56px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>

<body>
  <div class="arcade-bg" aria-hidden="true">
    <div class="ceiling-line ceiling-line-a"></div>
    <div class="ceiling-line ceiling-line-b"></div>

    <div class="cabinet cabinet-left cabinet-one"></div>
    <div class="cabinet cabinet-left cabinet-two"></div>
    <div class="cabinet cabinet-right cabinet-one"></div>
    <div class="cabinet cabinet-right cabinet-two"></div>

    <div class="floor-grid"></div>
  </div>

  <main class="home">
    <h1 class="brand">TREMA</h1>
    <div class="brand-mark" aria-hidden="true"></div>
    <p class="subtitle">Escolha seu modo</p>

    <nav class="menu" aria-label="Modos de jogo">
      <a class="mode-button" href="treino.html">TREINO</a>
      <a class="mode-button" href="arena.html">ARENA</a>
    </nav>

    <p class="hint">
      Use <kbd>Tab</kbd> para navegar e <kbd>Enter</kbd> para selecionar
    </p>
  </main>
</body>
</html>
